spring.application.name=chemquest-backend

# Only accept connections from this computer (the desktop app runs on the same machine).
server.address=127.0.0.1
server.port=8080

# MySQL connection. The password is read from the environment variable
# CHEMQUEST_DB_PASSWORD so it is never saved in a file you might share.
spring.datasource.url=jdbc:mysql://localhost:3306/chemquest?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${CHEMQUEST_DB_USER:chemquest}
spring.datasource.password=${CHEMQUEST_DB_PASSWORD:}

# We create tables ourselves with SQL scripts, so Spring must not touch the schema.
spring.sql.init.mode=never
